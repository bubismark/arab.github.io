<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ערבית – סיפור 1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap');
:root {
  --bg:#0d1117; --surface:#161b22; --card:#1c2230;
  --border:rgba(255,255,255,0.09); --accent:#e8b84b; --green:#4caf82;
  --red:#e05c5c; --text:#e6edf3; --muted:#7d8590;
  --hl:rgba(232,184,75,0.13); --hl2:rgba(232,184,75,0.28);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Rubik',sans-serif;}

header{background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 18px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:100;}
.logo{font-size:17px;font-weight:700;color:var(--accent);}
.logo span{color:var(--muted);font-weight:300;font-size:13px;}

/* PLAYER */
.player-wrap{max-width:820px;margin:16px auto 0;padding:0 14px;}
.player-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;}
audio{width:100%;accent-color:var(--accent);display:block;}
.prog{margin-top:8px;height:4px;background:var(--border);border-radius:4px;cursor:pointer;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear;}
.speed-row{margin-top:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.speed-label{font-size:11px;color:var(--muted);}
.sp{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:3px 11px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;}
.sp:hover{border-color:var(--accent);color:var(--accent);}
.sp.on{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:700;}
#tts-status{font-size:11px;color:var(--muted);margin-top:8px;direction:rtl;min-height:16px;}

/* REPEAT PANEL */
.repeat-panel{max-width:820px;margin:12px auto 0;padding:0 14px;}
.repeat-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;}
.repeat-title{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:10px;direction:rtl;}
.repeat-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;direction:rtl;}
.repeat-label{font-size:12px;color:var(--muted);flex-shrink:0;}
.repeat-select{background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:4px 10px;border-radius:8px;font-family:inherit;font-size:12px;cursor:pointer;}
.repeat-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
.rbtn{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;
  transition:all .12s;}
.rbtn:hover{border-color:var(--accent);color:var(--accent);}
.rbtn.active{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:700;}
.rbtn.stop{border-color:var(--red);color:var(--red);}
.rbtn.stop:hover{background:var(--red);color:#fff;}
.repeat-status{font-size:12px;color:var(--green);margin-top:6px;direction:rtl;min-height:18px;}

/* TITLE */
.title-wrap{max-width:820px;margin:14px auto 0;padding:0 14px;text-align:center;}
.title-tl{font-size:16px;font-weight:600;line-height:1.7;direction:rtl;}
.title-he{font-size:12px;color:var(--muted);margin-top:2px;}

/* STORY */
.story{max-width:820px;margin:0 auto;padding:14px 14px 120px;}

/* SEGMENT */
.seg{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;
  border-radius:12px;margin-bottom:7px;direction:rtl;
  border-right:3px solid transparent;transition:background .2s,border-color .2s;}
.seg.cur{background:var(--hl);border-right-color:var(--accent);}
.seg.past{opacity:.32;}
.seg-left{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
.seg-t{font-size:11px;color:var(--muted);min-width:32px;
  cursor:pointer;direction:ltr;font-variant-numeric:tabular-nums;text-align:center;}
.seg-t:hover{color:var(--accent);}
/* repeat checkbox */
.rep-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
.seg-words{flex:1;display:flex;flex-wrap:wrap;gap:8px 5px;direction:rtl;align-items:flex-end;}

/* WORD CARD */
.wc{display:inline-flex;flex-direction:column;align-items:center;
  padding:5px 8px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;transition:background .1s,border-color .1s;
  user-select:none;-webkit-user-select:none;
  background:none;font-family:inherit;min-width:36px;}
.wc:hover,.wc:active{background:var(--hl);border-color:rgba(232,184,75,.25);}
.wc.on{background:var(--hl2);border-color:var(--accent);}
.wc.rich .wt{border-bottom:2px solid rgba(76,175,130,.75);}
.wt{font-size:18px;color:var(--text);text-align:center;line-height:1.3;direction:rtl;}
.wh{font-size:10px;color:var(--green);text-align:center;margin-top:4px;line-height:1.3;max-width:90px;direction:rtl;}
.wa{font-family:'Scheherazade New',serif;font-size:15px;color:var(--muted);text-align:center;margin-top:2px;direction:rtl;}

/* MODAL */
.ov{display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.82);backdrop-filter:blur(6px);
  z-index:500;align-items:flex-end;justify-content:center;}
.ov.show{display:flex;}
.mb{background:var(--surface);border:1px solid rgba(232,184,75,.28);
  border-radius:22px 22px 0 0;width:100%;max-width:820px;
  height:82vh;display:flex;flex-direction:column;
  animation:up .2s ease;overflow:hidden;}
@keyframes up{from{transform:translateY(32px);opacity:0}to{transform:translateY(0);opacity:1}}
.mb-top{flex-shrink:0;padding:18px 18px 0;}
.mb-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.mb-word{direction:rtl;}
.mb-tl{font-size:30px;font-weight:700;color:var(--accent);}
.mb-ar{font-family:'Scheherazade New',serif;font-size:24px;color:var(--muted);margin-top:3px;direction:rtl;}
.mb-close{background:var(--card);border:1px solid var(--border);color:var(--muted);
  width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mb-close:hover{color:var(--text);}
.tts{display:flex;align-items:center;gap:10px;width:100%;
  background:rgba(232,184,75,.12);border:1px solid rgba(232,184,75,.4);
  color:var(--accent);padding:10px 14px;border-radius:10px;
  cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;
  transition:all .12s;margin-bottom:12px;}
.tts:hover{background:rgba(232,184,75,.22);}
.tts.go{border-color:var(--green);color:var(--green);background:rgba(76,175,130,.1);}
.tts-ar{font-family:'Scheherazade New',serif;font-size:20px;direction:rtl;margin-right:auto;}
.mb-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 18px 40px;}
.tr-box{background:var(--card);border-radius:10px;padding:12px 16px;margin-bottom:12px;direction:rtl;}
.tr-he{font-size:20px;font-weight:600;}
.tr-note{font-size:12px;color:var(--muted);margin-top:4px;}
.sec{font-size:10px;text-transform:uppercase;letter-spacing:2px;
  color:var(--muted);margin:14px 0 6px;direction:rtl;}
.chips{display:flex;gap:7px;flex-wrap:wrap;direction:rtl;}
.chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;}
.chip .lbl{color:var(--muted);font-size:10px;display:block;margin-bottom:3px;}
.chip.root .val{color:var(--accent);font-family:'Scheherazade New',serif;font-size:19px;direction:rtl;}
.chip.binyan .val{color:#a78bfa;font-size:13px;}
.affs{display:flex;gap:7px;flex-wrap:wrap;direction:rtl;}
.af{background:var(--card);border-radius:9px;padding:8px 12px;font-size:12px;border-right:3px solid var(--green);}
.af.s{border-right:none;border-left:3px solid var(--red);}
.af .al{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.af .aa{font-family:'Scheherazade New',serif;font-size:19px;color:var(--accent);direction:rtl;}
.af .at{font-size:12px;color:var(--text);direction:rtl;margin-top:2px;}
.af .ah{font-size:11px;color:var(--muted);}
table.ct{width:100%;border-collapse:collapse;font-size:12px;direction:rtl;}
table.ct th{color:var(--muted);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;font-size:11px;}
table.ct td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;}
table.ct tr:last-child td{border-bottom:none;}
.car{font-family:'Scheherazade New',serif;font-size:16px;color:var(--green);direction:rtl;}
.syns{display:flex;gap:6px;flex-wrap:wrap;direction:rtl;}
.syn{background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;font-size:12px;display:flex;gap:6px;align-items:center;
  cursor:pointer;transition:border-color .1s;}
.syn:hover{border-color:var(--accent);}
.sar{font-family:'Scheherazade New',serif;font-size:16px;color:var(--accent);direction:rtl;}
.exs{display:flex;flex-direction:column;gap:8px;}
.ex{background:var(--card);border-radius:9px;padding:10px 14px;direction:rtl;
  cursor:pointer;border:1px solid transparent;transition:border-color .1s;}
.ex:hover{border-color:rgba(232,184,75,.25);}
.ex-tl{font-size:15px;margin-bottom:2px;}
.ex-ar{font-family:'Scheherazade New',serif;font-size:17px;color:var(--muted);direction:rtl;}
.ex-he{font-size:11px;color:var(--muted);margin-top:2px;}
.cur{background:linear-gradient(135deg,rgba(232,184,75,.06),rgba(76,175,130,.06));
  border:1px solid var(--border);border-radius:11px;
  padding:12px 16px;font-size:13px;line-height:1.9;margin-top:14px;direction:rtl;}
.cur strong{color:var(--accent);}
</style>
</head>
<body>

<header>
  <div class="logo">עַרָבִּית <span>/ عربي &nbsp;סיפור 1</span></div>
</header>

<div class="player-wrap">
  <div class="player-box">
    <audio id="aud" controls preload="auto"><source src="story1.mp3" type="audio/mpeg"></audio>
    <div class="prog" id="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
    <div class="speed-row">
      <span class="speed-label">מהירות:</span>
      <button class="sp" data-s="0.5">0.5×</button>
      <button class="sp" data-s="0.75">0.75×</button>
      <button class="sp on" data-s="1">1×</button>
      <button class="sp" data-s="1.25">1.25×</button>
      <button class="sp" data-s="1.5">1.5×</button>
    </div>
    <div id="tts-status"></div>
  </div>
</div>

<!-- REPEAT PANEL -->
<div class="repeat-panel">
  <div class="repeat-box">
    <div class="repeat-title">🔁 שינון שורות – בחר שורות עם ✓ ולחץ התחל</div>
    <div class="repeat-row">
      <span class="repeat-label">מרווח בין חזרות:</span>
      <select class="repeat-select" id="rep-gap">
        <option value="1500">1.5 שניות</option>
        <option value="2000" selected>2 שניות</option>
        <option value="3000">3 שניות</option>
        <option value="4000">4 שניות</option>
        <option value="5000">5 שניות</option>
      </select>
      <span class="repeat-label">מצב:</span>
      <select class="repeat-select" id="rep-mode">
        <option value="ar">ערבית בלבד</option>
        <option value="ar-he" selected>ערבית ← עברית</option>
        <option value="tl-he">תעתיק ← עברית</option>
      </select>
    </div>
    <div class="repeat-btns">
      <button class="rbtn" id="btn-rep-start" onclick="startRepeat()">▶ התחל שינון</button>
      <button class="rbtn stop" id="btn-rep-stop" onclick="stopRepeat()" style="display:none">■ עצור</button>
      <button class="rbtn" onclick="selectAll()">✓ סמן הכל</button>
      <button class="rbtn" onclick="clearAll()">✗ נקה הכל</button>
    </div>
    <div class="repeat-status" id="rep-status"></div>
  </div>
</div>

<div class="title-wrap">
  <div class="title-tl">בְּהָאי לְ-בְּלָאד לָאזַם לְ-וָאחַד יִעְרַף יִחְכִּי עַל-קְלִילָה לַעְתֵּין</div>
  <div class="title-he">במדינה הזאת צריך לדעת לדבר שתי שפות לפחות</div>
</div>

<div class="story" id="story"></div>

<!-- MODAL -->
<div class="ov" id="ov">
  <div class="mb" id="mb">
    <div class="mb-top">
      <div class="mb-head">
        <div class="mb-word">
          <div class="mb-tl" id="m-tl"></div>
          <div class="mb-ar" id="m-ar"></div>
        </div>
        <button class="mb-close" id="btn-close">✕</button>
      </div>
      <button class="tts" id="btn-tts">
        <span id="tts-icon">🔊</span>
        <span>לחץ לשמוע את המילה בערבית</span>
        <span class="tts-ar" id="tts-ar"></span>
      </button>
    </div>
    <div class="mb-body" id="mb-body">
      <div class="tr-box">
        <div class="tr-he" id="m-tr"></div>
        <div class="tr-note" id="m-note"></div>
      </div>
      <div id="adv"></div>
    </div>
  </div>
</div>

<script>

  {t:99, he:"שבמדינה הזאת צריך לדעת לדבר לפחות שתי שפות",
   w:[{tl:"אִנּוּ",ar:"إنه",he:"שֶׁ-",k:"אִנַּק"},{tl:"בְּהָאי",ar:"بهاي",he:"בָּזֹאת"},{tl:"לְ-בְּלָאד",ar:"البلاد",he:"הַמְּדִינָה"},{tl:"לָאזַם",ar:"لازم",he:"צָרִיךְ",k:"לָאזַם"},{tl:"לְ-וָאחַד",ar:"الواحد",he:"הָאָדָם",k:"לְ-וָאחַד"},{tl:"יִעְרַף",ar:"يعرف",he:"יֵדַע",k:"יִעְרַף"},{tl:"יִחְכִּי",ar:"يحكي",he:"לְדַבֵּר",k:"יִחְכִּי"},{tl:"עַל-קְלִילָה",ar:"عالقليلة",he:"לְפָחוֹת",k:"קְלִילָה"},{tl:"לַעְתֵּין",ar:"لغتين",he:"שְׁתֵּי שָׂפוֹת",k:"לַעְתֵּין"}]},
];

/* ═══════════════════════════════════════
   TTS – Google Translate
═══════════════════════════════════════ */
let currentArText = '';
let ttsAudio = null;

function speak(text) {
  if (!text) return;
  if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
  const btn = document.getElementById('btn-tts');
  const icon = document.getElementById('tts-icon');
  const status = document.getElementById('tts-status');
  btn.classList.add('go'); icon.textContent = '🔈';
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=ar&client=tw-ob`;
  ttsAudio = new Audio(url);
  ttsAudio.playbackRate = 0.85;
  ttsAudio.onended = () => { btn.classList.remove('go'); icon.textContent='🔊'; ttsAudio=null; };
  ttsAudio.onerror = () => { btn.classList.remove('go'); icon.textContent='🔊';
    status.textContent='❌ שגיאת TTS – בדוק חיבור אינטרנט'; ttsAudio=null; };
  ttsAudio.play().catch(e => {
    btn.classList.remove('go'); icon.textContent='🔊';
    status.textContent=`❌ ${e.message}`;
  });
}

/* ═══════════════════════════════════════
   REPEAT / DRILL ENGINE
═══════════════════════════════════════ */
let repTimer = null;
let repQueue = [];
let repIdx   = 0;

function getCheckedSegs() {
  return [...document.querySelectorAll('.rep-check:checked')]
    .map(cb => parseInt(cb.dataset.si));
}

function startRepeat() {
  const idxs = getCheckedSegs();
  if (!idxs.length) {
    document.getElementById('rep-status').textContent = '⚠️ בחר לפחות שורה אחת';
    return;
  }
  stopRepeat();
  repQueue = idxs;
  repIdx = 0;
  document.getElementById('btn-rep-start').style.display = 'none';
  document.getElementById('btn-rep-stop').style.display = '';
  drillNext();
}

function stopRepeat() {
  clearTimeout(repTimer);
  if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
  repQueue = [];
  document.getElementById('btn-rep-start').style.display = '';
  document.getElementById('btn-rep-stop').style.display = 'none';
  document.getElementById('rep-status').textContent = '';
}

function drillNext() {
  if (!repQueue.length) return;
  const si  = repQueue[repIdx % repQueue.length];
  repIdx++;
  const seg = S[si];
  const gap = parseInt(document.getElementById('rep-gap').value);
  const mode = document.getElementById('rep-mode').value;

  // highlight row
  document.querySelectorAll('.seg').forEach(el => el.classList.remove('drill'));
  const row = document.getElementById('seg'+si);
  if (row) { row.classList.add('cur'); row.scrollIntoView({behavior:'smooth',block:'center'}); }

  const round = Math.floor((repIdx-1)/repQueue.length)+1;
  document.getElementById('rep-status').textContent =
    `🔁 חזרה ${round} | שורה ${si+1}/${S.length}: ${seg.he}`;

  function playAr(cb) {
    if (ttsAudio) { ttsAudio.pause(); ttsAudio=null; }
    const arText = seg.w.map(w=>w.ar).join(' ');
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(arText)}&tl=ar&client=tw-ob`;
    ttsAudio = new Audio(url);
    ttsAudio.playbackRate = 0.82;
    ttsAudio.onended = () => { ttsAudio=null; if(cb) cb(); };
    ttsAudio.onerror = () => { ttsAudio=null; if(cb) cb(); };
    ttsAudio.play().catch(()=>{ if(cb) cb(); });
  }

  function playHe(cb) {
    if (ttsAudio) { ttsAudio.pause(); ttsAudio=null; }
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(seg.he)}&tl=he&client=tw-ob`;
    ttsAudio = new Audio(url);
    ttsAudio.onended = () => { ttsAudio=null; if(cb) cb(); };
    ttsAudio.onerror = () => { ttsAudio=null; if(cb) cb(); };
    ttsAudio.play().catch(()=>{ if(cb) cb(); });
  }

  function afterAll() {
    if (!repQueue.length) return;
    repTimer = setTimeout(drillNext, gap);
  }

  if (mode === 'ar') {
    playAr(() => repTimer = setTimeout(afterAll, gap));
  } else if (mode === 'ar-he') {
    playAr(() => {
      repTimer = setTimeout(() => playHe(() => repTimer = setTimeout(afterAll, gap)), 1800);
    });
  } else { // tl – just Hebrew
    playHe(() => repTimer = setTimeout(afterAll, gap));
  }
}

function selectAll() {
  document.querySelectorAll('.rep-check').forEach(cb => cb.checked = true);
}
function clearAll() {
  document.querySelectorAll('.rep-check').forEach(cb => cb.checked = false);
}

/* ═══════════════════════════════════════
   SPEED
═══════════════════════════════════════ */
const aud = document.getElementById('aud');
document.querySelectorAll('.sp').forEach(btn => {
  btn.addEventListener('click', () => {
    aud.playbackRate = parseFloat(btn.dataset.s);
    document.querySelectorAll('.sp').forEach(b => b.classList.toggle('on', b===btn));
  });
});

/* ═══════════════════════════════════════
   PROGRESS BAR
═══════════════════════════════════════ */
aud.addEventListener('timeupdate', () => {
  if (aud.duration)
    document.getElementById('prog-fill').style.width = (aud.currentTime/aud.duration*100)+'%';
  syncKaraoke();
});
document.getElementById('prog-bar').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  if (aud.duration) aud.currentTime = (e.clientX-r.left)/r.width*aud.duration;
});

/* ═══════════════════════════════════════
   RENDER
═══════════════════════════════════════ */
function fmtT(s){ const m=Math.floor(s/60),ss=Math.floor(s%60); return m+':'+(ss<10?'0':'')+ss; }

(function renderStory() {
  const c = document.getElementById('story');
  S.forEach((seg,si) => {
    const row = document.createElement('div');
    row.className='seg'; row.id='seg'+si;

    // left: time + checkbox
    const left = document.createElement('span');
    left.className='seg-left';

    const tspan = document.createElement('span');
    tspan.className='seg-t'; tspan.textContent=fmtT(seg.t);
    tspan.addEventListener('click',()=>{ aud.currentTime=seg.t; });
    left.appendChild(tspan);

    const cb = document.createElement('input');
    cb.type='checkbox'; cb.className='rep-check'; cb.dataset.si=si;
    cb.title='סמן לשינון';
    left.appendChild(cb);

    row.appendChild(left);

    const words = document.createElement('span');
    words.className='seg-words';
    seg.w.forEach(w => {
      const card = document.createElement('button');
      card.type='button';
      card.className='wc'+(w.k&&WD[w.k]?' rich':'');
      card.innerHTML=`<span class="wt">${w.tl}</span><span class="wh">${w.he}</span><span class="wa">${w.ar}</span>`;
      card.addEventListener('click',e=>{ e.stopPropagation(); openModal(w); });
      words.appendChild(card);
    });
    row.appendChild(words);
    c.appendChild(row);
  });
})();

/* ═══════════════════════════════════════
   KARAOKE SYNC
═══════════════════════════════════════ */
let curSeg=-1;
function syncKaraoke() {
  const t=aud.currentTime; let active=0;
  for(let i=0;i<S.length;i++) if(t>=S[i].t) active=i;
  if(active===curSeg) return;
  if(curSeg>=0){ const o=document.getElementById('seg'+curSeg); if(o){o.classList.remove('cur');o.classList.add('past');} }
  curSeg=active;
  const el=document.getElementById('seg'+curSeg);
  if(el){ el.classList.remove('past');el.classList.add('cur');el.scrollIntoView({behavior:'smooth',block:'center'}); }
}

/* ═══════════════════════════════════════
   MODAL
═══════════════════════════════════════ */
let activeCard=null;
function openModal(w) {
  if(activeCard) activeCard.classList.remove('on');
  document.querySelectorAll('.wc').forEach(c=>{
    if(c.querySelector('.wt')?.textContent===w.tl&&c.querySelector('.wa')?.textContent===w.ar){
      activeCard=c; c.classList.add('on');
    }
  });
  const d=w.k?WD[w.k]:null;
  currentArText=w.ar;
  document.getElementById('m-tl').textContent=w.tl;
  document.getElementById('m-ar').textContent=w.ar;
  document.getElementById('tts-ar').textContent=w.ar;
  document.getElementById('m-tr').textContent=w.he;
  document.getElementById('m-note').textContent=d?d.note:'';
  const adv=document.getElementById('adv');
  if(d){
    adv.innerHTML=`
      <div class="sec">שורש ובניין</div>
      <div class="chips">
        <div class="chip root"><span class="lbl">שורש</span><span class="val">${d.root.ar}</span><span style="font-size:11px;color:var(--muted);display:block">${d.root.he}</span></div>
        <div class="chip binyan"><span class="lbl">בניין / משקל</span><span class="val">${d.binyan}</span></div>
      </div>
      <div class="sec">תחיליות וסופיות</div>
      <div class="affs">${
        d.pre.length===0&&d.suf.length===0
          ?'<span style="color:var(--muted);font-size:13px">אין תחיליות/סופיות ייחודיות</span>'
          :d.pre.map(p=>`<div class="af"><div class="al">תחילית</div><div class="aa">${p.ar}</div><div class="at">${p.tl}</div><div class="ah">${p.he}</div></div>`).join('')
          +d.suf.map(s=>`<div class="af s"><div class="al">סופית</div><div class="aa">${s.ar}</div><div class="at">${s.tl}</div><div class="ah">${s.he}</div></div>`).join('')
      }</div>
      <div class="sec">הטיה לפי גוף וזמן</div>
      <div style="overflow-x:auto"><table class="ct">
        <thead><tr><th>גוף</th><th>תעתיק</th><th>ערבית</th><th>עברית</th></tr></thead>
        <tbody>${d.conj.map(r=>`<tr><td style="color:var(--muted)">${r.p}</td><td>${r.tl}</td><td class="car">${r.ar}</td><td style="color:var(--muted);font-size:11px">${r.he}</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="sec">מילים נרדפות</div>
      <div class="syns">${d.syn.map(s=>`<div class="syn" onclick="speak('${s.ar}')"><span class="sar">${s.ar}</span><span style="color:var(--text);font-size:12px">${s.tl}</span><span style="color:var(--muted);font-size:11px">${s.he}</span></div>`).join('')}</div>
      <div class="sec">דוגמאות – לחץ להשמעה</div>
      <div class="exs">${d.ex.map(e=>`<div class="ex" onclick="speak('${e.ar}')"><div class="ex-tl">${e.tl}</div><div class="ex-ar">${e.ar}</div><div class="ex-he">${e.he}</div></div>`).join('')}</div>
      <div class="cur">${d.cur}</div>`;
  } else {
    adv.innerHTML=`<div style="margin-top:10px;padding:12px 16px;background:var(--card);border-radius:10px;direction:rtl;">
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">מילה בסיסית</div>
      <div style="font-size:16px;color:var(--text)">${w.he}</div>
      <div style="font-family:'Scheherazade New',serif;font-size:20px;color:var(--accent);margin-top:6px;direction:rtl">${w.ar}</div>
    </div>`;
  }
  document.getElementById('mb-body').scrollTop=0;
  document.getElementById('ov').classList.add('show');
}

function closeModal() {
  document.getElementById('ov').classList.remove('show');
  if(activeCard){activeCard.classList.remove('on');activeCard=null;}
}
document.getElementById('ov').addEventListener('click',e=>{if(e.target===document.getElementById('ov'))closeModal();});
document.getElementById('btn-close').addEventListener('click',closeModal);
document.getElementById('btn-tts').addEventListener('click',()=>speak(currentArText));
document.getElementById('mb').addEventListener('click',e=>e.stopPropagation());
</script>
